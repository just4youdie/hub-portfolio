<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Selected 3D and graphic design work by Ruben Alves.">
  <title>Work - Ruben Alves</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://cdn.spline.design/@splinetool/viewer@2.0.9/build/spline-viewer.js"></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="spline-bg" aria-hidden="true">
    <spline-viewer url="https://prod.spline.design/R5h5fsEqatRWan44/scene.splinecode"></spline-viewer>
    <div class="spline-scrim"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Homepage">
      <span class="brand-mark">RA</span>
      <span>RUBEN ALVES</span>
    </a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="work.html" class="active">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a class="nav-cv wave-cta" href="cv.pdf" download>Download CV ↗</a>
    </nav>
    <button type="button" class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
  </header>

  <main>
    <section class="work-page">
      <div class="work-intro">
        <p class="eyebrow">01 / SELECTED WORK</p>
        <h2>Projects with <em>a point of view.</em></h2>
        <p>Pick a category, then search by tag to narrow the results.</p>
      </div>

      <div class="work-tabs" role="tablist" aria-label="Work categories">
        <button type="button" class="tab-btn active" data-tab="3d">3D related</button>
        <button type="button" class="tab-btn" data-tab="graphic">Graphic Designer</button>
        <button type="button" class="tab-btn" data-tab="contests">Contests</button>
        <button type="button" class="tab-btn" data-tab="commissions">Commissions</button>
        <button type="button" class="tab-btn" data-tab="games">Games</button>
      </div>

      <div class="work-search">
        <span class="work-search-icon" aria-hidden="true">⌕</span>
        <input
          type="search"
          data-gallery-search
          list="tag-options"
          placeholder="Search by tag - e.g. 3D Modelling"
          aria-label="Search projects by tag"
        >
      </div>
      <datalist id="tag-options"></datalist>

      <div class="gallery-grid" data-gallery-grid></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
